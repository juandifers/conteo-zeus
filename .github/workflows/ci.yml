# CI for conteo-zeus.
#
# Two things here are not routine and are the reason this file exists:
#
#   - **G1 runs on every commit.** It is the byte-equality freeze over
#     `samples/golden/`, and one of the two files it checks is the .txt Zeus
#     actually posted. When it fails, the default assumption is that the change
#     is wrong, not that the golden file is stale.
#   - **Migrations run here and nowhere else.** Never on a cold start: a
#     serverless function that migrated on boot would run DDL from however many
#     concurrent cold starts a deploy produced, against a database several of
#     them are already reading. `/api/health` refuses to be green when the
#     schema is behind, and this job is the only thing that moves it.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, tests (G1 included)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Typecheck
        run: npx tsc -b
      - name: Unit tests
        # Includes G1/G2/G3 (tests/golden.test.ts), the P1 fold migration proof
        # (tests/domain/migration.test.ts) and the schema checks
        # (tests/backend/migrations.test.ts).
        run: npm test
      - run: npm run build

  migrations:
    name: migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        # A throwaway Postgres, not the Neon branch. The migrations are plain
        # SQL and must stay that way — a schema that only applies against one
        # provider is a schema nobody can test against.
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conteo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations to a throwaway database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/conteo_test
        run: node tools/migrate.mjs
      - name: Re-run to prove they are idempotent
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/conteo_test
        run: node tools/migrate.mjs --check
      - name: Exercise the schema and the endpoints against it
        # Every `*.pg.test.ts` skips itself without DATABASE_URL, so this is the
        # only job that runs them.
        #
        #   schema.pg    `raw_row text[]`, `cantidad text` and `source_bytes
        #                bytea` surviving a round trip through the driver, which
        #                reading the DDL cannot tell you.
        #   sessions.pg  the catalogue reassembling out of Postgres to bytes
        #                identical to `source_bytes`, the dispatch gate, and the
        #                counter payload's allowlist — over a real response, and
        #                again after that response has been through the device's
        #                own store into a real IndexedDB and back.
        #   push.pg      replay, gap and fork as three distinct outcomes; the
        #                finish manifest; device binding; and the `bigserial`
        #                cursor. `unique (counter_id, seq)` is what makes a
        #                replay idempotent and a fork detectable, so none of it
        #                means anything without a real constraint behind it.
        #   acciones.pg  counters changing hands mid-count (P2.3.5): that a
        #                reassignment writes no row in `events`, that a stale
        #                plan and a concurrent one are both refused with nothing
        #                half-written, that retirement is refused while somebody
        #                still holds shelves, and that the sealing gate is opened
        #                only by an action that will be printed on the acta. The
        #                guards are SQL predicates, and the failure they defend
        #                against — an unmatched `update` raising nothing — is
        #                invisible to anything that mocks the driver.
        #
        #                It also covers P2.4's waivers, which ride the same
        #                chain: that a waiver survives a `jsonb` round trip byte
        #                for byte (the payload is hashed and `jsonb` does not
        #                preserve key order), that it carries no quantity, and
        #                that `anular_waiver` withdraws one without deleting it.
        #
        #   sellar.pg    P2.5: that the seal freezes both chains and that
        #                **nothing can be appended between it and the export** —
        #                asserted by attempting, with every writer in the system
        #                invited to write and every one of them refusing. The
        #                guard is a predicate on the insert plus a row lock, so
        #                it cannot be exercised without a real transaction. Also
        #                that `export_bytes` is a real `bytea` round trip (a
        #                re-download that came back as a `\x…` string would be a
        #                file twice the size and entirely wrong), that a
        #                re-download is byte-identical, and G2 over a whole
        #                session: every zero in the count column traces to an
        #                explicit `add(0)` or to an `existencia` that was already
        #                zero.
        #
        # These run the handlers' own SQL against a real database rather than a
        # stub: a mock proves a handler calls a function, this proves the query
        # is a query.
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/conteo_test
        run: >-
          npx vitest run
          tests/backend/schema.pg.test.ts
          tests/backend/sessions.pg.test.ts
          tests/backend/push.pg.test.ts
          tests/backend/acciones.pg.test.ts
          tests/backend/sellar.pg.test.ts

  offline:
    name: offline (Playwright)
    runs-on: ubuntu-latest
    # Added in P2.2, and the reason is in the diff that added it: two specs here
    # had been silently stale since the review bar was trimmed and the eviction
    # banners were removed, because nothing ran them. A suite whose entire job is
    # to be believed about offline cannot be one nobody runs.
    #
    # It is the only place a service worker, a real IndexedDB and a network that
    # is actually absent come together. jsdom cannot stage any of the three.
    #
    #   sync.spec    volume and durability — 200 events, a page teardown, and
    #                exactly-once delivery when the signal returns.
    #   shift.spec   a whole afternoon through the screens somebody touches:
    #                search, 40 entries, 3 empty shelves, 2 notes, a correction
    #                and «Terminar», with the blind rule checked against the
    #                rendered page rather than against the source (P2.3).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:offline

  deploy-migrations:
    name: migrate the Neon database
    # Only on the default branch, and only after the checks pass. A migration
    # applied from a feature branch would move the schema under a production
    # deploy that has not shipped yet.
    #
    # **Read the default branch from the repository rather than naming one.**
    # This was pinned to `refs/heads/main` and this repository's default branch
    # is `master`, so the job never ran once — silently, because a skipped job
    # is a green tick. The schema fell behind the deploy and the only thing that
    # said so was `/api/health`, which is exactly the failure it exists to
    # report and exactly the wrong place to learn about it. Asking GitHub which
    # branch is the default one also survives a rename, which naming it does not.
    if: >-
      github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch
    needs: [check, migrations, offline]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node tools/migrate.mjs
